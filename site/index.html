<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>딸일까 아들일까 · 성별 맞추기 투표</title>
<meta property="og:type" content="website">
<meta property="og:title" content="딸일까 아들일까? 🍼">
<meta property="og:description" content="아기 성별 맞추기 투표에 참여해 주세요! 투표하면 결과도 볼 수 있어요.">
<meta name="description" content="아기 성별 맞추기 투표 페이지를 1분 만에 만들고 공유하세요.">
<meta name="theme-color" content="#FDF7F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="딸일까아들일까">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Quicksand:wght@500;600;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #FDF7F8; --bg-2: #F6EFF7;
    --surface: #FFFFFF; --surface-2: #FBF5F7;
    --ink: #3D2F36; --ink-2: #7A6971; --muted: #A99BA2;
    --line: #F1E4E9; --line-2: #E4D3DB;
    --girl: #E8608E; --girl-soft: #FDEBF2; --girl-grad: linear-gradient(100deg,#E8608E,#F2859F);
    --boy: #5478DE; --boy-soft: #EAEFFC; --boy-grad: linear-gradient(100deg,#5478DE,#7F9CEC);
    --gift: #A9762A; --gift-soft: #FDF4E0; --gift-line: #EBD6A4;
    --shadow-s: 0 1px 2px rgba(61,47,54,.04), 0 4px 14px -10px rgba(61,47,54,.18);
    --shadow-m: 0 1px 3px rgba(61,47,54,.05), 0 14px 34px -22px rgba(61,47,54,.34);
    --radius: 18px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1519; --bg-2: #221A21; --surface: #261E24; --surface-2: #2E242C;
      --ink: #F4EAEF; --ink-2: #BFACB6; --muted: #8E7C86;
      --line: #3A2E36; --line-2: #4A3B45;
      --girl: #F58AB0; --girl-soft: #3B2029;
      --boy: #93ACF3; --boy-soft: #1F2539;
      --gift: #E9C77A; --gift-soft: #33291A; --gift-line: #5C4926;
      --shadow-s: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px -10px rgba(0,0,0,.6);
      --shadow-m: 0 1px 3px rgba(0,0,0,.35), 0 16px 36px -24px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1519; --bg-2: #221A21; --surface: #261E24; --surface-2: #2E242C;
    --ink: #F4EAEF; --ink-2: #BFACB6; --muted: #8E7C86;
    --line: #3A2E36; --line-2: #4A3B45;
    --girl: #F58AB0; --girl-soft: #3B2029;
    --boy: #93ACF3; --boy-soft: #1F2539;
    --gift: #E9C77A; --gift-soft: #33291A; --gift-line: #5C4926;
    --shadow-s: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px -10px rgba(0,0,0,.6);
    --shadow-m: 0 1px 3px rgba(0,0,0,.35), 0 16px 36px -24px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg-2); min-height: 100%; }
  body { min-height: 100vh; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(60% 40% at 18% 0%, var(--girl-soft) 0%, transparent 70%),
      radial-gradient(56% 38% at 88% 6%, var(--boy-soft) 0%, transparent 72%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: break-word; min-height: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 64px; display: flex; flex-direction: column; gap: 16px; }

  /* hero */
  .hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 2px; }
  .eyebrow { margin: 0; font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
  h1 { margin: 0; font-family: "Jua", "Noto Sans KR", sans-serif; font-weight: 400; font-size: clamp(34px, 9.5vw, 48px); line-height: 1.24; letter-spacing: -.01em; text-wrap: balance; }
  h1 .lucky { color: var(--gift); }
  h1 .q { color: var(--girl); }
  .sub { margin: 0; font-family: "Jua", sans-serif; font-size: 17px; color: var(--ink-2); }
  .sub .g { color: var(--girl); }
  .sub .b { color: var(--boy); }
  .lede { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 34ch; }
  .gift { margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; background: var(--gift-soft); border: 1px solid var(--gift-line); color: var(--gift); font-weight: 700; font-size: 14px; padding: 11px 20px; border-radius: 99px; box-shadow: var(--shadow-s); }
  .gift .em { font-size: 17px; }
  .deadline { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .deadline b { color: var(--ink); font-weight: 700; }
  .deadline .left { color: var(--girl); font-weight: 700; }
  .deadline.closed { color: var(--muted); }

  /* cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow-m); }
  .card.flush { padding: 0; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .card-title { margin: 0; font-family: "Jua", sans-serif; font-weight: 400; font-size: 18px; }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); font-family: "Quicksand", sans-serif; letter-spacing: .08em; }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--girl); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* 초음파 + D-day */
  .scan { display: block; width: 100%; background: #0d0d0d; }
  .scan-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 15px; }
  .scan-cap { min-width: 0; }
  .scan-cap .t { font-family: "Jua", sans-serif; font-size: 15px; }
  .scan-cap .d { font-size: 12px; color: var(--muted); }
  .dday { flex: none; text-align: right; }
  .dday .n { font-family: "Jua", sans-serif; font-size: 27px; line-height: 1.1; color: var(--gift); font-variant-numeric: tabular-nums; }
  .dday .l { font-size: 11px; color: var(--muted); font-weight: 500; }
  .lock { text-align: center; padding: 26px 20px 24px; }
  .lock .ic { font-size: 34px; line-height: 1; }
  .lock .t { margin: 10px 0 4px; font-family: "Jua", sans-serif; font-size: 20px; line-height: 1.3; }
  .lock .d { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
  .lock .go { display: inline-block; margin-top: 14px; font-family: "Jua", sans-serif; font-size: 15px; color: #fff; background: var(--girl); padding: 10px 18px; border-radius: 99px; text-decoration: none; }
  .lock .fine { margin: 12px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .reveal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 14px; }
  .reveal-head .t { font-family: "Jua", sans-serif; font-size: 21px; color: var(--girl); line-height: 1.2; }
  .reveal-head .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .reveal-head .badge { flex: none; font-size: 30px; line-height: 1; }
  .reveal-vid { display: block; width: 100%; height: auto; max-height: 78vh; min-height: 200px; object-fit: contain; background: #0d0d0d; }

  /* 집계 */
  .tally { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .side { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .side.right { text-align: right; align-items: flex-end; }
  .big { font-weight: 900; font-size: clamp(34px, 11vw, 46px); line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .side.left .big { color: var(--girl); }
  .side.right .big { color: var(--boy); }
  .side-name { font-size: 13px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  .side.right .side-name { flex-direction: row-reverse; }
  .track { margin-top: 14px; height: 13px; border-radius: 99px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); display: flex; }
  .fill-g { background: var(--girl-grad); transition: width .55s cubic-bezier(.22,1,.36,1); }
  .fill-b { background: var(--boy-grad); transition: width .55s cubic-bezier(.22,1,.36,1); }
  .track.empty { background: repeating-linear-gradient(105deg, var(--surface-2) 0 9px, transparent 9px 18px); }
  .tally-note { margin: 13px 0 0; text-align: center; font-size: 13px; color: var(--ink-2); }
  .tally-note b { color: var(--ink); font-weight: 700; }
  .tally-lead { margin: 3px 0 0; text-align: center; font-family: "Jua", sans-serif; font-size: 15px; }

  /* form */
  .label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .label .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 5px; }
  .field { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .15s ease, background .15s ease; }
  textarea.field { resize: vertical; min-height: 76px; line-height: 1.6; }
  .field::placeholder { color: var(--muted); }
  .field:focus { outline: none; border-color: var(--line-2); background: var(--surface); }
  .field:focus-visible, .pick:focus-visible, button:focus-visible { outline: 2px solid var(--gift); outline-offset: 2px; }
  .group + .group { margin-top: 18px; }

  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .pick { position: relative; appearance: none; cursor: pointer; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line-2); border-radius: 14px; padding: 17px 10px 15px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease; }
  .pick:hover { transform: translateY(-2px); }
  .pick .face { font-size: 29px; line-height: 1.1; filter: saturate(.55) opacity(.75); transition: filter .15s ease; }
  .pick .nm { font-family: "Jua", sans-serif; font-size: 20px; color: var(--ink-2); transition: color .15s ease; }
  .pick .tick { position: absolute; top: 8px; right: 9px; width: 19px; height: 19px; border-radius: 99px; display: grid; place-items: center; font-size: 11px; font-weight: 900; color: #fff; opacity: 0; transform: scale(.6); transition: opacity .15s ease, transform .15s ease; }
  .pick[aria-pressed="true"] .face { filter: none; }
  .pick[aria-pressed="true"] .tick { opacity: 1; transform: scale(1); }
  .pick[data-choice="daughter"][aria-pressed="true"] { background: var(--girl-soft); border-color: var(--girl); box-shadow: 0 8px 20px -12px var(--girl); }
  .pick[data-choice="daughter"][aria-pressed="true"] .nm { color: var(--girl); }
  .pick[data-choice="daughter"] .tick { background: var(--girl); }
  .pick[data-choice="son"][aria-pressed="true"] { background: var(--boy-soft); border-color: var(--boy); box-shadow: 0 8px 20px -12px var(--boy); }
  .pick[data-choice="son"][aria-pressed="true"] .nm { color: var(--boy); }
  .pick[data-choice="son"] .tick { background: var(--boy); }

  .submit { margin-top: 20px; width: 100%; font: inherit; font-family: "Jua", sans-serif; font-size: 17px; cursor: pointer; color: #fff; background: var(--ink); border: none; border-radius: 13px; padding: 14px; transition: filter .15s ease; }
  .submit[data-choice="daughter"] { background: var(--girl-grad); }
  .submit[data-choice="son"] { background: var(--boy-grad); }
  .submit:hover { filter: brightness(1.05); }
  .submit:disabled { cursor: not-allowed; filter: none; background: var(--surface-2) !important; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
  .note { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; min-height: 1em; }
  .note.warn { color: var(--girl); }
  .fineprint { margin: 12px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

  .voted { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .voted .mine { font-family: "Jua", sans-serif; font-size: 22px; }
  .voted .mine.daughter { color: var(--girl); }
  .voted .mine.son { color: var(--boy); }
  .voted .sub2 { font-size: 13px; color: var(--ink-2); margin: 0; }
  .voted .gift-mini { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--gift); background: var(--gift-soft); border: 1px solid var(--gift-line); padding: 7px 14px; border-radius: 99px; }
  .linkbtn { margin-top: 10px; font: inherit; font-size: 13px; cursor: pointer; background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:hover { color: var(--ink); }

  /* 한마디 + 좋아요 */
  .entry { display: flex; gap: 11px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: none; padding-bottom: 0; }
  .entry:first-child { padding-top: 0; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; font-size: 18px; }
  .av.daughter { background: var(--girl-soft); }
  .av.son { background: var(--boy-soft); }
  .entry-body { min-width: 0; flex: 1; }
  .entry-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .entry-name { font-size: 14px; font-weight: 700; }
  .entry-vote { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .entry-vote.daughter { color: var(--girl); background: var(--girl-soft); }
  .entry-vote.son { color: var(--boy); background: var(--boy-soft); }
  .entry-me { font-size: 11px; font-weight: 700; color: var(--gift); letter-spacing: .06em; }
  .entry-msg { font-size: 13.5px; color: var(--ink-2); margin-top: 1px; }

  .like {
    flex: none; align-self: center;
    display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 99px;
    padding: 6px 11px 6px 9px; min-width: 52px; justify-content: center;
    transition: color .15s ease, background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .like:hover { color: var(--girl); border-color: var(--girl); }
  .like svg { width: 14px; height: 14px; display: block; }
  .like .n { font-variant-numeric: tabular-nums; }
  .like[aria-pressed="true"] { color: var(--girl); background: var(--girl-soft); border-color: var(--girl); }
  .like.pop { transform: scale(1.14); }
  .like:disabled { opacity: .5; cursor: default; }

  .empty { font-size: 13.5px; color: var(--muted); text-align: center; padding: 4px 0; margin: 0; }

  /* 이유 없이 투표한 분들 */
  .quiet { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-2); }
  .quiet:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .quiet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
  .quiet-title { font-family: "Jua", sans-serif; font-weight: 400; font-size: 15px; margin: 0; }
  .quiet-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .qchip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 500; padding: 4px 10px 4px 7px; border-radius: 99px; }
  .qchip.daughter { color: var(--girl); background: var(--girl-soft); }
  .qchip.son { color: var(--boy); background: var(--boy-soft); }
  .qchip.me { box-shadow: 0 0 0 1.5px var(--gift) inset; }
  .qchip .f { font-size: 13px; }
  .share { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .ghost { font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-2); border-radius: 99px; padding: 9px 18px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .ghost:hover { color: var(--ink); border-color: var(--ink-2); }
  .ghost.danger { color: var(--girl); }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin: 0; }
  .foot a { color: var(--ink-2); }

  /* 앱 공통 */
  .cover { display: block; width: 100%; max-height: 70vh; object-fit: cover; background: #0d0d0d; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font: inherit; font-family: "Jua", sans-serif; font-size: 17px; cursor: pointer; color: #fff; background: var(--girl-grad); border: none; border-radius: 13px; padding: 14px; text-decoration: none; transition: filter .15s ease; }
  .btn:hover { filter: brightness(1.05); }
  .btn.dark { background: var(--ink); color: var(--bg); }
  .btn.boy { background: var(--boy-grad); }
  .btn:disabled { cursor: not-allowed; filter: none; background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .steps li { display: flex; gap: 12px; align-items: flex-start; }
  .steps .num { flex: none; width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; font-family: "Jua", sans-serif; font-size: 14px; color: var(--gift); background: var(--gift-soft); border: 1px solid var(--gift-line); }
  .steps b { display: block; font-size: 14.5px; }
  .steps span { font-size: 13px; color: var(--ink-2); }
  .file-pick { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px dashed var(--line-2); border-radius: 12px; background: var(--surface-2); cursor: pointer; }
  .file-pick:hover { border-color: var(--ink-2); }
  .file-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .file-pick .thumb { flex: none; width: 56px; height: 56px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 24px; overflow: hidden; border: 1px solid var(--line); }
  .file-pick .thumb img, .file-pick .thumb video { width: 100%; height: 100%; object-fit: cover; }
  .file-pick .ft { font-size: 13.5px; font-weight: 700; }
  .file-pick .fd { font-size: 12px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
  .prog { margin-top: 10px; height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--girl-grad); transition: width .2s ease; }
  .linkbox { display: flex; gap: 8px; align-items: stretch; }
  .linkbox .field { font-size: 13.5px; padding: 10px 12px; }
  .linkbox button { flex: none; }
  .copybtn { font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: #fff; background: var(--ink); border: none; border-radius: 10px; padding: 0 14px; }
  .warnbox { margin-top: 10px; font-size: 12.5px; color: var(--gift); background: var(--gift-soft); border: 1px solid var(--gift-line); border-radius: 12px; padding: 10px 12px; line-height: 1.55; }
  .okbox { text-align: center; padding: 6px 0 2px; }
  .okbox .ic { font-size: 40px; line-height: 1; }
  .okbox .t { margin: 8px 0 2px; font-family: "Jua", sans-serif; font-size: 22px; }
  .okbox .d { margin: 0; font-size: 13px; color: var(--ink-2); }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stat div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; }
  .stat b { display: block; font-size: 22px; font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--ink-2); }

  // 이미지는 브라우저에서 줄여서 올림 (실패하면 원본)
  function shrinkImage(file) {
    return new Promise(function (resolve) {
      if (!/^image\//.test(file.type) || /gif$/.test(file.type)) return resolve(file);
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { resolve(b && b.size < file.size ? new File([b], "img.jpg", { type: "image/jpeg" }) : file); }, "image/jpeg", 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }
  function extOf(file) {
    var m = /\.([a-z0-9]{2,5})$/i.exec(file.name || ""); var e = m ? m[1].toLowerCase() : "";
    if (!e) e = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif", "video/mp4": "mp4", "video/quicktime": "mov", "video/webm": "webm" }[file.type] || "bin";
    if (e === "jpeg") e = "jpg";
    return e;
  }
  function upload(file, onProg) {

      var type = file.type || ({ mov: "video/quicktime", mp4: "video/mp4", heic: "image/heic" }[extOf(file)] || "application/octet-stream");
      var xhr = new XMLHttpRequest();
      xhr.open("POST", SB + "/storage/v1/object/" + BUCKET + "/" + path);
      var h = hdr({ "Content-Type": type, "x-upsert": "false", "cache-control": "31536000" });
      for (var k in h) xhr.setRequestHeader(k, h[k]);
      xhr.upload.onprogress = function (e) { if (e.lengthComputable && onProg) onProg(e.loaded / e.total); };
      xhr.onload = function () { if (xhr.status >= 200 && xhr.status < 300) resolve(path); else reject(new Error("upload " + xhr.status + " " + xhr.responseText)); };
      xhr.onerror = function () { reject(new Error("network")); };

      if (!b || !b.poll) throw new Error("gone");

      (b.likes || []).forEach(function (l) { P.likeCount[l.target] = l.n || 0; if (l.mine) P.myLikes[l.target] = true; });
      computeVotes();
      if (P.poll.revealed && P.mine && !P.reveal) {
        return rpc("get_reveal", { pid: P.id, v: P.vid }).then(function (r) { P.reveal = r || null; }).catch(function () {});

  function computeVotes() {

      var at = String(r.created_at || "");

    });
    // 카카오 계정당 한 표는 서버가 보장 → 이름이 같아도 다른 사람
    var entries = [];

    P.entries = entries;

    for (var i = 0; i < raw.length; i++) if (raw[i].own) { P.mine = raw[i]; break; }

    if (P.mine) for (var j = 0; j < entries.length; j++) if (entries[j].key === P.mine.key) { P.myVote = entries[j]; break; }
    if (P.mine && !P.myVote) P.myVote = P.mine;

    quiet.forEach(function (v) {
      var c = document.createElement("span"); c.className = "qchip " + v.choice + (v.key === myKey ? " me" : "");
      var f = document.createElement("span"); f.className = "f"; f.textContent = FACE[v.choice]; c.appendChild(f);
      c.appendChild(document.createTextNode((v.nickname || "익명") + (v.key === myKey ? " (나)" : "")));
      q.appendChild(c);
    });
  }

  function paintLike(btn, target) {
    var n = P.likeCount[target] || 0, on = !!P.myLikes[target];
    btn.setAttribute("aria-pressed", String(on));
    btn.setAttribute("aria-label", "공감 " + n + "개");
    btn.querySelector(".n").textContent = n;
  }
  function toggleLike(target, btn) {
    if (P.likeBusy[target]) return; P.likeBusy[target] = true;
    var liked = !!P.myLikes[target];
    P.myLikes[target] = !liked; P.likeCount[target] = Math.max(0, (P.likeCount[target] || 0) + (liked ? -1 : 1));
    paintLike(btn, target);
    if (!liked) { btn.classList.add("pop"); setTimeout(function () { btn.classList.remove("pop"); }, 160); }
    rpc("poll_like", { pid: P.id, tgt: target, v: P.vid, on_: !liked }).then(function (ok) { if (!ok) throw 0; }).catch(function () {
      P.myLikes[target] = liked; P.likeCount[target] = Math.max(0, (P.likeCount[target] || 0) + (liked ? 1 : -1)); paintLike(btn, target);
    }).then(function () { P.likeBusy[target] = false; });
  }

  function submitVote() {
    if (P.busy || !P.picked) return;
    if (!me()) { login(); return; }
    var nickname = voterName(); if (!nickname) return;
    P.busy = true; refreshSubmit(); setNote("보내는 중…", false);
    insert("poll_votes", { poll_id: P.id, vid: "u" + me().id, user_id: me().id, name_type: P.nameType, choice: P.picked, nickname: nickname, message: $("msg").value.trim().slice(0, 80) })
      .then(function (r) {
        if (!r.ok && r.status !== 409) throw new Error(String(r.status));
        P.busy = false;
        return refreshPoll().then(function () {
          var target = P.reveal ? $("revealCard") : $("voteCard");
          if (target && target.scrollIntoView) target.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }).catch(function () {
        P.busy = false; refreshSubmit();
        setNote(pollClosed() ? "투표가 마감됐어요." : "전송에 실패했어요. 다시 눌러 주세요.", true);
      });
  }

  /* ================= 관리 ================= */
  var A = null;
  function viewAdmin(id, token) {
    app.innerHTML = '<div class="spin"></div>';
    A = { id: id, token: token, poll: null, votes: [], answer: null, revealFile: null, coverFile: null };
    rpc("admin_get_poll", { pid: id, token: token }).then(function (r) { return [r, (r && r.votes) || []]; })
      .then(function (res) {
        if (!res[0]) { app.innerHTML = head("Oops", "관리 링크가 올바르지 않아요", "") + '<p class="foot"><a href="#/">처음으로</a></p>'; return; }
        A.poll = res[0]; A.votes = res[1] || []; A.answer = A.poll.answer;
        if (token !== "-") rememberPoll(id, token, A.poll.baby_name);
        renderAdmin();
      }).catch(function () { app.innerHTML = head("Oops", "불러오지 못했어요", "잠시 뒤 새로고침해 주세요"); });
  }

  function adminTally() {
    var p = A.poll, cuts = [];
    if (p.deadline) cuts.push(Date.parse(p.deadline)); if (p.revealed_at) cuts.push(Date.parse(p.revealed_at));
    var cut = cuts.length ? Math.min.apply(null, cuts) : Infinity, seen = {}, entries = [];
    A.votes.forEach(function (r) {
      var v = { nickname: String(r.nickname || "").trim(), choice: r.choice, at: r.created_at, late: Date.parse(r.created_at) >= cut };
      var k = "_" + r.id, cur = seen[k];
      if (!cur) { seen[k] = v; entries.push(v); return; }
      if (cur.late && (!v.late || Date.parse(v.at) < Date.parse(cur.at))) { entries[entries.indexOf(cur)] = v; seen[k] = v; }
    });
    return entries;
  }

  function renderAdmin() {
    var p = A.poll, bn = esc(p.baby_name), fresh = ls("lp.fresh") === p.id;
    if (fresh) ls("lp.fresh", null);
    setTitle(p.baby_name + " · 관리");
    var entries = adminTally(), g = 0, b = 0;
    entries.forEach(function (v) { if (v.choice === "daughter") g++; else b++; });
    var revealed = !!p.answer;
    var winners = revealed ? entries.filter(function (v) { return v.choice === p.answer && !v.late; }) : [];
    var lateWin = revealed ? entries.filter(function (v) { return v.choice === p.answer && v.late; }) : [];

    app.innerHTML =
      head("Admin", '<span class="lucky">' + bn + '</span> 관리', '') +
      (fresh ? '<section class="card okbox"><div class="ic">🎉</div><p class="t">페이지가 만들어졌어요!</p><p class="d">아래 투표 링크를 단톡방에 공유하세요</p></section>' : '') +

      '<section class="card"><div class="card-head"><h2 class="card-title">🔗 링크</h2></div>' +
      '<div class="group"><span class="label">투표 링크 <span class="hint">지인들에게 공유</span></span>' + linkBox("lnkPoll", pollUrl(p.id)) + '</div>' +
      (A.token === "-" ? '<p class="muted">🔐 카카오 계정으로 관리 중이에요. 같은 카카오 계정으로 로그인하면 어느 폰에서든 관리할 수 있어요.</p>' :
      '<div class="group"><span class="label">관리 링크 <span class="hint">나만 간직</span></span>' + linkBox("lnkAdmin", adminUrl(p.id, A.token)) +
      '<div class="warnbox">⚠️ 관리 링크는 로그인 대신이에요. ' + (p.owner_id ? '카카오 계정으로도 관리할 수 있지만, 링크도 꼭 저장해 두세요.' : '잃어버리면 결과를 공개할 수 없으니 카톡 나에게 보내기 등으로 꼭 저장해 두세요.') + ' 남에게 주면 그 사람도 수정할 수 있어요.</div></div>') +
      '<div class="share" style="margin-top:14px"><a class="ghost" href="#/p/' + esc(p.id) + '">👀 투표 페이지 보기</a></div></section>' +

      '<section class="card"><div class="card-head"><h2 class="card-title">📊 현황</h2></div>' +
      '<div class="stat"><div><b>' + entries.length + '</b><span>참여</span></div><div class="g"><b>' + g + '</b><span>👧 딸</span></div><div class="b"><b>' + b + '</b><span>👦 아들</span></div></div>' +
      (entries.length ? '<p class="names">' + entries.map(function (v) { return esc(v.nickname) + (v.choice === "daughter" ? "👧" : "👦"); }).join(" · ") + '</p>' : '<p class="muted">아직 투표가 없어요</p>') + '</section>' +

      '<section class="card"><div class="card-head"><h2 class="card-title">🎬 결과 공개</h2>' + (revealed ? '<span class="badge-on" style="margin-left:auto">공개 중 · ' + LABEL[p.answer] + '</span>' : '') + '</div>' +
      '<div class="group"><span class="label">공개 영상 / 사진 <span class="hint">최대 50MB · 투표한 사람만 볼 수 있어요</span></span>' +
      filePicker("rFile", p.reveal_path ? "올라간 파일 바꾸기" : "영상 고르기", p.reveal_path ? "이미 올라가 있어요 ✓" : "풍선 터뜨리는 영상 등", "video/*,image/*", p.reveal_path ? "✅" : "🎬") +
      '<button type="button" class="ghost" id="rUpload" style="margin-top:10px" hidden>⬆️ 이 파일 올리기</button></div>' +
      '<div class="group"><span class="label">정답</span><div class="picks">' +
      '<button type="button" class="pick" data-ans="daughter" data-choice="daughter" aria-pressed="' + (A.answer === "daughter") + '"><span class="tick">✓</span><span class="face">👧</span><span class="nm">딸</span></button>' +
      '<button type="button" class="pick" data-ans="son" data-choice="son" aria-pressed="' + (A.answer === "son") + '"><span class="tick">✓</span><span class="face">👦</span><span class="nm">아들</span></button></div></div>' +
      (revealed
        ? '<div class="btn-row" style="margin-top:18px"><button type="button" class="btn dark" id="rSave">정답 변경 저장</button><button type="button" class="btn" style="background:var(--surface-2);color:var(--ink-2)" id="rHide">공개 취소</button></div>'
        : '<button type="button" class="btn" id="rGo" style="margin-top:18px" ' + (A.answer ? '' : 'disabled') + '>결과 공개하기 🎉</button>') +
      '<p class="note" id="rNote">' + (revealed ? "공개 후 투표한 사람은 ‘늦은 투표’로 따로 표시돼요" : "공개하면 투표한 사람에게만 결과와 영상이 보여요") + '</p></section>' +

      (revealed ? '<section class="card"><div class="card-head"><h2 class="card-title">🎁 정답자 명단</h2><span class="live">' + winners.length + '명</span></div>' +
        (winners.length ? '<p class="names" id="winNames">' + winners.map(function (v) { return esc(v.nickname); }).join(", ") + '</p><div class="share" style="margin-top:12px"><button type="button" class="ghost" id="winCopy">📋 명단 복사</button></div>' : '<p class="muted">정답자가 없어요</p>') +
        (lateWin.length ? '<p class="muted">마감·공개 후 늦게 맞힌 분 ' + lateWin.length + '명: ' + lateWin.map(function (v) { return esc(v.nickname); }).join(", ") + '</p>' : '') + '</section>' : '') +

      '<section class="card"><div class="card-head"><h2 class="card-title">✏️ 정보 수정</h2></div>' +
      '<div class="group"><label class="label" for="eBaby">태명</label><input class="field" id="eBaby" maxlength="20" value="' + bn + '"></div>' +
      '<div class="group"><label class="label" for="eParents">엄마 아빠 이름</label><input class="field" id="eParents" maxlength="40" value="' + esc(p.parents) + '"></div>' +
      '<div class="group"><span class="label">표지 사진</span>' + filePicker("eCover", p.cover_path ? "사진 바꾸기" : "사진 고르기", p.cover_path ? "지금 사진 유지하려면 그대로 두세요" : "초음파 사진 추천", "image/*", p.cover_path ? '<img src="' + esc(mediaUrl(p.cover_path)) + '" alt="">' : "🩻") + '</div>' +
      '<div class="group"><label class="label" for="eIntro">한마디</label><textarea class="field" id="eIntro" maxlength="200">' + esc(p.intro) + '</textarea></div>' +
      '<div class="group two"><div><label class="label" for="eReveal">결과 발표일</label><input class="field" id="eReveal" type="date" value="' + esc(p.reveal_date || "") + '"></div>' +
      '<div><label class="label" for="eDeadline">투표 마감</label><input class="field" id="eDeadline" type="datetime-local" value="' + esc(localInput(p.deadline)) + '"></div></div>' +
      '<div class="group"><label class="label" for="eGift">맞히면 선물</label><input class="field" id="eGift" maxlength="60" value="' + esc(p.gift) + '"></div>' +
      '<button type="button" class="btn dark" id="eSave" style="margin-top:18px">저장</button><p class="note" id="eNote"></p></section>' +

      '<div class="share"><button type="button" class="ghost danger" id="delPoll">🗑️ 페이지 삭제</button><a class="ghost" href="#/">🏠 처음으로</a></div>';

    bindCopies(app);
    if ($("winCopy")) $("winCopy").addEventListener("click", function () { copy($("winNames").textContent, "명단이 복사됐어요 ✓"); });

    // 공개 영상 업로드
    bindPicker("rFile", function (f) { A.revealFile = f; $("rUpload").hidden = false; });
    $("rUpload").addEventListener("click", function () {
      var f = A.revealFile, note = $("rNote"); if (!f) return;
      if (f.size > MAX_BYTES) { note.className = "note warn"; note.textContent = "50MB 넘는 파일은 못 올려요. 앞뒤를 잘라서 다시 골라주세요."; return; }
      $("rUpload").disabled = true; note.className = "note"; note.textContent = "올리는 중… 화면을 닫지 마세요";
      shrinkImage(f).then(function (ff) { return upload(ff, function (x) { setProg("rFile", x); note.textContent = "올리는 중… " + Math.round(x * 100) + "%"; }); })
        .then(function (path) { return rpc("admin_update_poll", { pid: A.id, token: A.token, p: { reveal_path: path } }).then(function (ok) { if (!ok) throw new Error("auth"); A.poll.reveal_path = path; }); })
        .then(function () { toast("공개 영상이 올라갔어요 ✓"); $("rUpload").hidden = true; $("rUpload").disabled = false; $("rFileDesc").textContent = "올라갔어요 ✓"; note.textContent = A.poll.answer ? "투표한 사람들에게 새 영상이 보여요" : "이제 정답 고르고 공개하면 돼요"; })
        .catch(function (e) { $("rUpload").disabled = false; setProg("rFile", null); note.className = "note warn"; note.textContent = "올리지 못했어요. 다시 눌러 주세요."; console.error(e); });
    });
    var ansBtns = Array.prototype.slice.call(document.querySelectorAll("[data-ans]"));
    ansBtns.forEach(function (bt) { bt.addEventListener("click", function () {
      A.answer = bt.getAttribute("data-ans");
      ansBtns.forEach(function (x) { x.setAttribute("aria-pressed", String(x === bt)); });
      if ($("rGo")) { $("rGo").disabled = false; $("rGo").className = A.answer === "son" ? "btn boy" : "btn"; }
    }); });
    function saveAnswer(ans, msg) {
      return rpc("admin_update_poll", { pid: A.id, token: A.token, p: { answer: ans || "" } }).then(function (ok) {
        if (!ok) throw new Error("auth"); toast(msg); viewAdmin(A.id, A.token);
      }).catch(function () { var n = $("rNote"); n.className = "note warn"; n.textContent = "저장하지 못했어요. 다시 눌러 주세요."; });
    }
    if ($("rGo")) $("rGo").addEventListener("click", function () {
      if (!A.answer) return;
      if (!A.poll.reveal_path && !window.confirm("공개 영상 없이 정답만 공개할까요?")) return;
      if (!window.confirm(LABEL[A.answer] + "(으)로 결과를 공개할까요?\n투표한 사람에게 바로 보여요.")) return;
      saveAnswer(A.answer, "결과가 공개됐어요 🎉");
    });
    if ($("rSave")) $("rSave").addEventListener("click", function () { saveAnswer(A.answer, "정답을 저장했어요"); });
    if ($("rHide")) $("rHide").addEventListener("click", function () { if (window.confirm("공개를 취소할까요? 다시 아무도 결과를 못 봐요.")) saveAnswer("", "공개를 취소했어요"); });

    // 정보 수정
    bindPicker("eCover", function (f) { A.coverFile = f; });
    $("eSave").addEventListener("click", function () {
      var note = $("eNote"), btn = $("eSave");
      if (!$("eBaby").value.trim()) { note.className = "note warn"; note.textContent = "태명을 적어주세요"; return; }
      btn.disabled = true; note.className = "note"; note.textContent = "저장 중…";
      var dl = $("eDeadline").value;
      var patch = { baby_name: $("eBaby").value.trim(), parents: $("eParents").value.trim(), intro: $("eIntro").value.trim(), gift: $("eGift").value.trim(), reveal_date: $("eReveal").value, deadline: dl ? new Date(dl).toISOString() : "" };
      var step = A.coverFile ? shrinkImage(A.coverFile).then(function (f) { return upload(f, function (x) { setProg("eCover", x); }); }).then(function (path) { patch.cover_path = path; }) : Promise.resolve();
      step.then(function () { return rpc("admin_update_poll", { pid: A.id, token: A.token, p: patch }); })
        .then(function (ok) { if (!ok) throw new Error("auth"); toast("저장됐어요 ✓"); viewAdmin(A.id, A.token); })
        .catch(function (e) { btn.disabled = false; setProg("eCover", null); note.className = "note warn"; note.textContent = "저장하지 못했어요. 다시 눌러 주세요."; console.error(e); });
    });

    $("delPoll").addEventListener("click", function () {
      if (!window.confirm("정말 삭제할까요? 투표와 한마디가 모두 사라지고 되돌릴 수 없어요.")) return;
      rpc("admin_delete_poll", { pid: A.id, token: A.token }).then(function (ok) {
        if (!ok) throw 0; forgetPoll(A.id); toast("삭제됐어요"); location.hash = "#/";
      }).catch(function () { toast("삭제하지 못했어요"); });
    });
  }

  /* ================= 개인정보 처리방침 ================= */
  function viewPrivacy() {
    setTitle("개인정보 처리방침");
    var li = function (t, d) { return '<div class="group"><b>' + t + '</b><p class="muted" style="margin-top:4px">' + d + '</p></div>'; };
    app.innerHTML = head("Privacy", "개인정보 처리방침", "") + '<section class="card">' +
      li("1. 수집하는 항목", "카카오 로그인 시: 카카오 닉네임, 프로필 사진(선택), 이메일(선택), 카카오 회원번호<br>투표 시: 표시 이름(카카오 닉네임 또는 직접 입력한 실명), 선택(딸/아들), 남긴 한마디<br>페이지를 만들 때: 태명, 부모 이름, 소개글, 올린 사진·영상") +
      li("2. 이용 목적", "한 사람 한 표 투표, 투표 결과·한마디 표시, 페이지 관리(내 페이지 목록), 정답자 명단 정리") +
      li("3. 보관 기간", "페이지를 삭제하면 그 페이지의 투표·한마디가 함께 지워져요. 로그인 정보는 탈퇴(삭제) 요청 시 지체 없이 지워요.") +
      li("4. 제3자 제공", "수집한 정보를 다른 곳에 제공하거나 판매하지 않아요. 투표 결과는 해당 페이지 링크를 받은 사람에게만 보여요.") +
      li("5. 처리 위탁 및 국외 저장", "데이터 저장: Supabase(싱가포르 리전) · 웹 호스팅: Vercel(미국) · 로그인: 카카오") +
      li("6. 삭제 요청 · 문의", "내 투표나 로그인 정보를 지우고 싶으면 페이지를 만든 분이나 운영자에게 요청해 주세요.") +
      '<p class="muted">시행일: 2026년 10월 20일</p></section><p class="foot"><a href="#/">← 처음으로</a></p>';
  }

  /* ---------- 라우터 ---------- */
  var timer = null;
  function route() {
    clearInterval(timer); timer = null; P = null; A = null;
    var h = location.hash.replace(/^#\/?/, "").split("/");
    window.scrollTo(0, 0);
    if (h[0] === "new") viewNew();
    else if (h[0] === "p" && h[1]) {
      viewPoll(h[1]);
      timer = setInterval(function () { if (P && P.poll && !document.hidden) refreshPoll(); }, 30000);
    }
    else if (h[0] === "a" && h[1] && h[2]) viewAdmin(h[1], h[2]);
    else if (h[0] === "privacy") viewPrivacy();
    else viewHome();
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && P && P.poll) refreshPoll(); });

  // 시작: 로그인 복귀(?code=…&next=…) 처리 후 라우팅
  function boot() {
    var q = new URLSearchParams(location.search), next = q.get("next");
    var done = function () {
      if (next != null || q.get("code")) history.replaceState(null, "", location.pathname + (next || location.hash || "#/"));
      route();
    };
    if (!sbc) return done();
    sbc.auth.getSession().then(function (r) { SESSION = r && r.data ? r.data.session : null; }).catch(function () {}).then(done);
    sbc.auth.onAuthStateChange(function (ev, sess) { SESSION = sess; });
  }
  boot();
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>딸일까 아들일까</title>

<meta property="og:type" content="website">
<meta property="og:title" content="딸일까, 아들일까 🍼">
<meta property="og:description" content="맞히신 분께는 작은 선물이 있어요! 이름 적고 한 표 주세요.">
<meta name="description" content="현명·현주네 아기 성별 맞추기 — 맞히신 분께 작은 선물이 있어요">
<meta name="theme-color" content="#FDF7F8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Quicksand:wght@500;600;700&display=swap">

<style>
  :root {
    color-scheme: light dark;
    --bg: #FDF7F8;
    --bg-2: #F6EFF7;
    --surface: #FFFFFF;
    --surface-2: #FBF5F7;
    --ink: #3D2F36;
    --ink-2: #7A6971;
    --muted: #A99BA2;
    --line: #F1E4E9;
    --line-2: #E4D3DB;

    --girl: #E8608E;
    --girl-soft: #FDEBF2;
    --girl-grad: linear-gradient(100deg, #E8608E, #F2859F);

    --boy: #5478DE;
    --boy-soft: #EAEFFC;
    --boy-grad: linear-gradient(100deg, #5478DE, #7F9CEC);

    --gift: #A9762A;
    --gift-soft: #FDF4E0;
    --gift-line: #EBD6A4;

    --shadow-s: 0 1px 2px rgba(61,47,54,.04), 0 4px 14px -10px rgba(61,47,54,.18);
    --shadow-m: 0 1px 3px rgba(61,47,54,.05), 0 14px 34px -22px rgba(61,47,54,.34);
    --radius: 18px;

    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1519;
      --bg-2: #221A21;
      --surface: #261E24;
      --surface-2: #2E242C;
      --ink: #F4EAEF;
      --ink-2: #BFACB6;
      --muted: #8E7C86;
      --line: #3A2E36;
      --line-2: #4A3B45;
      --girl: #F58AB0;
      --girl-soft: #3B2029;
      --girl-grad: linear-gradient(100deg, #E8608E, #F2859F);
      --boy: #93ACF3;
      --boy-soft: #1F2539;
      --boy-grad: linear-gradient(100deg, #5478DE, #7F9CEC);
      --gift: #E9C77A;
      --gift-soft: #33291A;
      --gift-line: #5C4926;
      --shadow-s: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px -10px rgba(0,0,0,.6);
      --shadow-m: 0 1px 3px rgba(0,0,0,.35), 0 16px 36px -24px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1519; --bg-2: #221A21; --surface: #261E24; --surface-2: #2E242C;
    --ink: #F4EAEF; --ink-2: #BFACB6; --muted: #8E7C86;
    --line: #3A2E36; --line-2: #4A3B45;
    --girl: #F58AB0; --girl-soft: #3B2029; --girl-grad: linear-gradient(100deg, #E8608E, #F2859F);
    --boy: #93ACF3; --boy-soft: #1F2539; --boy-grad: linear-gradient(100deg, #5478DE, #7F9CEC);
    --gift: #E9C77A; --gift-soft: #33291A; --gift-line: #5C4926;
    --shadow-s: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px -10px rgba(0,0,0,.6);
    --shadow-m: 0 1px 3px rgba(0,0,0,.35), 0 16px 36px -24px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(60% 40% at 18% 0%, var(--girl-soft) 0%, transparent 70%),
      radial-gradient(56% 38% at 88% 6%, var(--boy-soft) 0%, transparent 72%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: scroll;
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: break-word;
    min-height: 100%;
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-inline: 20px; padding-block: 42px 64px;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* ---------- hero ---------- */
  .hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; }
  .eyebrow {
    margin: 0; font-family: "Quicksand", sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: .28em; color: var(--muted); text-transform: uppercase;
  }
  h1 {
    margin: 0; font-family: "Jua", "Noto Sans KR", sans-serif; font-weight: 400;
    font-size: clamp(36px, 10vw, 50px); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance;
  }
  h1 .g { color: var(--girl); }
  h1 .b { color: var(--boy); }
  h1 .bottle { font-size: .82em; }
  .lede { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 34ch; text-wrap: pretty; }

  .gift {
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--gift-soft);
    border: 1px solid var(--gift-line);
    color: var(--gift);
    font-weight: 700; font-size: 14px;
    padding: 11px 20px; border-radius: 99px;
    box-shadow: var(--shadow-s);
  }
  .gift .em { font-size: 17px; }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: var(--shadow-m);
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .card-title { margin: 0; font-family: "Jua", sans-serif; font-weight: 400; font-size: 18px; letter-spacing: .01em; }
  .live {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; color: var(--muted);
    font-family: "Quicksand", sans-serif; letter-spacing: .08em;
  }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--girl); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* ---------- tally ---------- */
  .tally { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .side { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .side.right { text-align: right; align-items: flex-end; }
  .big {
    font-family: "Noto Sans KR", sans-serif; font-weight: 900;
    font-size: clamp(34px, 11vw, 46px); line-height: 1.05; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .side.left .big { color: var(--girl); }
  .side.right .big { color: var(--boy); }
  .side-name { font-size: 13px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  .side.right .side-name { flex-direction: row-reverse; }

  .track {
    margin-top: 14px; height: 13px; border-radius: 99px; overflow: hidden;
    background: var(--surface-2); border: 1px solid var(--line);
    display: flex;
  }
  .fill-g { background: var(--girl-grad); transition: width .55s cubic-bezier(.22,1,.36,1); }
  .fill-b { background: var(--boy-grad); transition: width .55s cubic-bezier(.22,1,.36,1); }
  .track.empty { background: repeating-linear-gradient(105deg, var(--surface-2) 0 9px, transparent 9px 18px); }

  .tally-note { margin: 13px 0 0; text-align: center; font-size: 13px; color: var(--ink-2); }
  .tally-note b { color: var(--ink); font-weight: 700; }
  .tally-lead { margin: 3px 0 0; text-align: center; font-family: "Jua", sans-serif; font-size: 15px; color: var(--ink); }

  /* ---------- form ---------- */
  .label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .label .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 5px; }
  .field {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; transition: border-color .15s ease, background .15s ease;
  }
  textarea.field { resize: vertical; min-height: 76px; line-height: 1.6; }
  .field::placeholder { color: var(--muted); }
  .field:focus { outline: none; border-color: var(--line-2); background: var(--surface); }
  .field:focus-visible, .pick:focus-visible, button:focus-visible { outline: 2px solid var(--gift); outline-offset: 2px; }
  .group + .group { margin-top: 18px; }

  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .pick {
    position: relative;
    appearance: none; cursor: pointer; font: inherit; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line-2); border-radius: 14px;
    padding: 17px 10px 15px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .pick:hover { transform: translateY(-2px); }
  .pick .face { font-size: 29px; line-height: 1.1; filter: saturate(.55) opacity(.75); transition: filter .15s ease; }
  .pick .nm { font-family: "Jua", sans-serif; font-size: 20px; color: var(--ink-2); transition: color .15s ease; }
  .pick .tick {
    position: absolute; top: 8px; right: 9px;
    width: 19px; height: 19px; border-radius: 99px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 900; color: #fff;
    opacity: 0; transform: scale(.6); transition: opacity .15s ease, transform .15s ease;
  }
  .pick[aria-pressed="true"] .face { filter: none; }
  .pick[aria-pressed="true"] .tick { opacity: 1; transform: scale(1); }
  .pick[data-choice="daughter"][aria-pressed="true"] { background: var(--girl-soft); border-color: var(--girl); box-shadow: 0 8px 20px -12px var(--girl); }
  .pick[data-choice="daughter"][aria-pressed="true"] .nm { color: var(--girl); }
  .pick[data-choice="daughter"] .tick { background: var(--girl); }
  .pick[data-choice="son"][aria-pressed="true"] { background: var(--boy-soft); border-color: var(--boy); box-shadow: 0 8px 20px -12px var(--boy); }
  .pick[data-choice="son"][aria-pressed="true"] .nm { color: var(--boy); }
  .pick[data-choice="son"] .tick { background: var(--boy); }

  .submit {
    margin-top: 20px; width: 100%; font: inherit;
    font-family: "Jua", sans-serif; font-size: 17px; cursor: pointer;
    color: #fff; background: var(--ink); border: none; border-radius: 13px; padding: 14px;
    transition: opacity .15s ease, filter .15s ease;
  }
  .submit[data-choice="daughter"] { background: var(--girl-grad); }
  .submit[data-choice="son"] { background: var(--boy-grad); }
  .submit:hover { filter: brightness(1.05); }
  .submit:disabled {
    cursor: not-allowed; filter: none;
    background: var(--surface-2) !important;
    color: var(--muted);
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .note { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; min-height: 1em; }
  .note.warn { color: var(--girl); }
  .fineprint { margin: 12px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

  /* ---------- voted ---------- */
  .voted { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .voted .mine { font-family: "Jua", sans-serif; font-size: 22px; }
  .voted .mine.daughter { color: var(--girl); }
  .voted .mine.son { color: var(--boy); }
  .voted .sub { font-size: 13px; color: var(--ink-2); margin: 0; }
  .voted .gift-mini {
    margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--gift);
    background: var(--gift-soft); border: 1px solid var(--gift-line);
    padding: 7px 14px; border-radius: 99px;
  }
  .linkbtn {
    margin-top: 10px; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: none; padding: 0; color: var(--muted);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .linkbtn:hover { color: var(--ink); }

  /* ---------- wall ---------- */
  .entry { display: flex; gap: 11px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: none; padding-bottom: 0; }
  .entry:first-child { padding-top: 0; }
  .av {
    flex: none; width: 34px; height: 34px; border-radius: 99px;
    display: grid; place-items: center; font-size: 18px;
  }
  .av.daughter { background: var(--girl-soft); }
  .av.son { background: var(--boy-soft); }
  .entry-body { min-width: 0; flex: 1; }
  .entry-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .entry-name { font-size: 14px; font-weight: 700; }
  .entry-vote { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .entry-vote.daughter { color: var(--girl); background: var(--girl-soft); }
  .entry-vote.son { color: var(--boy); background: var(--boy-soft); }
  .entry-me { font-size: 11px; font-weight: 700; color: var(--gift); letter-spacing: .06em; }
  .entry-msg { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; margin-top: 1px; }
  .empty { font-size: 13.5px; color: var(--muted); text-align: center; padding: 4px 0; margin: 0; }

  .share { display: flex; justify-content: center; margin-top: 4px; }
  .ghost {
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--line-2); border-radius: 99px; padding: 9px 18px;
  }
  .ghost:hover { color: var(--ink); border-color: var(--ink-2); }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin: 0; }

  @media (max-width: 400px) { .card { padding: 20px 16px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <p class="eyebrow">Baby Gender Party</p>
    <h1><span class="g">딸</span>일까 <span class="b">아들</span>일까 <span class="bottle">🍼</span></h1>
    <p class="lede">이름 적고 한 표만 주세요. 이유도 남겨주시면 더 좋고요 😊</p>
    <div class="gift"><span class="em">🎁</span> 맞히신 분께는 작은 선물이 있어요!</div>
  </header>

  <!-- 실시간 현황 -->
  <section class="card">
    <div class="card-head">
      <h2 class="card-title">📊 실시간 현황</h2>
      <span class="live"><span class="dot"></span>LIVE</span>
    </div>

    <div class="tally">
      <div class="side left">
        <span class="big" id="gBig">—</span>
        <span class="side-name"><span>👧</span><span id="gSub">딸 0표</span></span>
      </div>
      <div class="side right">
        <span class="big" id="bBig">—</span>
        <span class="side-name"><span>👦</span><span id="bSub">아들 0표</span></span>
      </div>
    </div>

    <div class="track empty" id="track">
      <div class="fill-g" id="gFill" style="width:0"></div>
      <div class="fill-b" id="bFill" style="width:0"></div>
    </div>

    <p class="tally-note" id="tallyNote">아직 아무도 투표하지 않았어요</p>
    <p class="tally-lead" id="tallyLead">첫 표의 주인공이 되어주세요 ✨</p>
  </section>

  <!-- 내 한 표 -->
  <section class="card">
    <div id="voteForm">
      <div class="card-head">
        <h2 class="card-title">✍️ 내 한 표</h2>
      </div>

      <div class="group">
        <label class="label" for="nick">이름 (또는 별명) <span class="hint">선물 드릴 때 필요해요</span></label>
        <input class="field" id="nick" type="text" maxlength="16" autocomplete="off" placeholder="예) 김대리, 큰이모">
      </div>

      <div class="group">
        <span class="label">어느 쪽에 거실래요?</span>
        <div class="picks">
          <button type="button" class="pick" data-choice="daughter" aria-pressed="false">
            <span class="tick" aria-hidden="true">✓</span>
            <span class="face" aria-hidden="true">👧</span>
            <span class="nm">딸</span>
          </button>
          <button type="button" class="pick" data-choice="son" aria-pressed="false">
            <span class="tick" aria-hidden="true">✓</span>
            <span class="face" aria-hidden="true">👦</span>
            <span class="nm">아들</span>
          </button>
        </div>
      </div>

      <div class="group">
        <label class="label" for="msg">이유 <span class="hint">안 써도 돼요</span></label>
        <textarea class="field" id="msg" maxlength="80" placeholder="엄마가 단 걸 좋아하면 딸이래요 🍰"></textarea>
      </div>

      <button type="button" class="submit" id="submit" disabled>투표하기</button>
      <p class="note" id="note">불러오는 중…</p>
      <p class="fineprint">한 번 더 투표하면 기존 표가 바뀝니다 (변심 허용 😉)</p>
    </div>

    <div class="voted" id="votedBox" hidden>
      <p class="sub">내가 고른 쪽은</p>
      <span class="mine" id="mineText">—</span>
      <p class="sub" id="mineMsg"></p>
      <span class="gift-mini">🎁 선물 대상에 들어가셨어요</span>
      <button type="button" class="linkbtn" id="redo">역시 마음이 바뀌었어요</button>
    </div>
  </section>

  <!-- 한마디 -->
  <section class="card" id="wallCard" hidden>
    <div class="card-head">
      <h2 class="card-title">💬 다들 이렇게 봤어요</h2>
    </div>
    <div id="wall"></div>
  </section>

  <div class="share">
    <button type="button" class="ghost" id="copy">🔗 투표 링크 복사</button>
  </div>

  <p class="foot">현명 &amp; 현주 · 2026</p>
</div>

<script>

  "use strict";

  var SUPABASE_URL = "https://wsvlpjnlsxfzfugrbmmz.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_YFGFGsHJOzPMInie2ehR5g_TV6OybXf";

  var TABLE = "votes";
  var $ = function (id) { return document.getElementById(id); };
  var LABEL = { son: "아들", daughter: "딸" };

  $("submit").addEventListener("click", submitVote);
  $("redo").addEventListener("click", function () {
    $("votedBox").hidden = true;
    $("voteForm").hidden = false;
    setNote("고친 다음 다시 투표하기를 눌러 주세요.", false);
  });
  $("copy").addEventListener("click", function () {
    var url = location.href.split("#")[0];
    var done = function () {
      $("copy").textContent = "복사됐어요 ✓";
      setTimeout(function () { $("copy").textContent = "🔗 투표 링크 복사"; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { window.prompt("링크를 복사하세요", url); });
    } else {
      window.prompt("링크를 복사하세요", url);
    }
  });

  function setNote(text, warn) {
    var n = $("note");
    n.textContent = text || "";
    n.className = warn ? "note warn" : "note";
  }
  function refreshSubmit() {
    $("submit").disabled = !(!busy && picked && $("nick").value.trim().length > 0);
  }

  /* ---------- 서버 ---------- */
  function headers(extra) {
    var h = { "apikey": SUPABASE_ANON_KEY };
    if (SUPABASE_ANON_KEY.split(".").length === 3) h["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;
    for (var k in extra) h[k] = extra[k];
    return h;
  }

  function loadResults() {
    var url = SUPABASE_URL + "/rest/v1/" + TABLE +
      "?select=vid,nickname,choice,message,created_at&order=created_at.desc";
    return fetch(url, { headers: headers() })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (rows) { render(rows || []); return rows; })
      .catch(function () {
        setNote("집계를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.", true);
        return null;
      });
  }

  function submitVote() {
    if (busy || !picked) return;
    var nickname = $("nick").value.trim().slice(0, 16);
    if (!nickname) return;

    busy = true;
    refreshSubmit();
    setNote("보내는 중…", false);

    fetch(SUPABASE_URL + "/rest/v1/" + TABLE + "?on_conflict=vid", {
      method: "POST",
      headers: headers({ "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify({
        vid: vid, choice: picked, nickname: nickname,
        message: $("msg").value.trim().slice(0, 80)
      })
    })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        busy = false; setNote("", false); refreshSubmit();
        return loadResults();
      })
      .catch(function () {
        busy = false; refreshSubmit();
        setNote("전송에 실패했어요. 다시 눌러 주세요.", true);
      });
  }

  /* ---------- 렌더 ---------- */
  function render(rows) {
    var entries = rows.map(function (r) {
      return {
        vid: String(r.vid || ""),
        nickname: String(r.nickname || ""),
        choice: r.choice === "daughter" ? "daughter" : "son",
        message: String(r.message || ""),
        at: String(r.created_at || "")
      };
    });

    var g = 0, b = 0;
    entries.forEach(function (v) { if (v.choice === "daughter") g++; else b++; });
    var total = g + b;
    var gPct = total ? Math.round((g / total) * 100) : 0;
    var bPct = total ? 100 - gPct : 0;

    // 표가 적을 땐 퍼센트 대신 표 수를 크게 (1표에 100%는 과하니까)
    var usePct = total >= PCT_MIN;
    $("gBig").textContent = usePct ? (gPct + "%") : (g + "표");
    $("bBig").textContent = usePct ? (bPct + "%") : (b + "표");
    $("gSub").textContent = usePct ? ("딸 " + g + "표") : "딸";
    $("bSub").textContent = usePct ? ("아들 " + b + "표") : "아들";

    $("track").className = total ? "track" : "track empty";
    $("gFill").style.width = (total ? gPct : 0) + "%";
    $("bFill").style.width = (total ? bPct : 0) + "%";

    var note = $("tallyNote"), lead = $("tallyLead");
    if (!total) {
      note.textContent = "아직 아무도 투표하지 않았어요";
      lead.textContent = "첫 표의 주인공이 되어주세요 ✨";
    } else {
      note.textContent = "";
      var strong = document.createElement("b");
      strong.textContent = total + "명";
      note.appendChild(document.createTextNode("지금까지 "));
      note.appendChild(strong);
      note.appendChild(document.createTextNode("이 투표했어요"));

      if (g === b) lead.textContent = "딱 동점이에요 🤝";
      else if (g > b) lead.textContent = "딸팀이 " + (g - b) + "표 앞서고 있어요 👧";
      else lead.textContent = "아들팀이 " + (b - g) + "표 앞서고 있어요 👦";
    }

    myVote = null;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].vid === vid) { myVote = entries[i]; break; }
    }

    // 한마디 월
    var withMsg = entries.filter(function (v) { return v.message; });
    var wall = $("wall");
    wall.textContent = "";
    $("wallCard").hidden = !entries.length;
    var listed = withMsg.length ? withMsg : entries;
    if (!listed.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "아직 남겨진 이야기가 없어요.";
      wall.appendChild(p);
    } else {
      listed.forEach(function (v) {
        var row = document.createElement("div");
        row.className = "entry";

        var av = document.createElement("div");
        av.className = "av " + v.choice;
        av.textContent = FACE[v.choice];
        row.appendChild(av);

        var body = document.createElement("div");
        body.className = "entry-body";

        var top = document.createElement("div");
        top.className = "entry-top";

        var name = document.createElement("span");
        name.className = "entry-name";
        name.textContent = v.nickname || "익명";
        top.appendChild(name);

        var chip = document.createElement("span");
        chip.className = "entry-vote " + v.choice;
        chip.textContent = LABEL[v.choice];
        top.appendChild(chip);

        if (v.vid === vid) {
          var me = document.createElement("span");
          me.className = "entry-me";
          me.textContent = "내 표";
          top.appendChild(me);
        }
        body.appendChild(top);

        if (v.message) {
          var msg = document.createElement("div");
          msg.className = "entry-msg";
          msg.textContent = v.message;
          body.appendChild(msg);
        }
        row.appendChild(body);
        wall.appendChild(row);
      });
    }

    // 내 표 상태
    if (myVote) {
      $("voteForm").hidden = true;
      $("votedBox").hidden = false;
      var mine = $("mineText");
      mine.textContent = FACE[myVote.choice] + " " + LABEL[myVote.choice];
      mine.className = "mine " + myVote.choice;
      $("mineMsg").textContent = myVote.message ? ("“" + myVote.message + "”") : "";
      picked = myVote.choice;
      $("submit").setAttribute("data-choice", picked);
      picks.forEach(function (bt) {
        bt.setAttribute("aria-pressed", String(bt.getAttribute("data-choice") === myVote.choice));
      });
      if (!$("nick").value) $("nick").value = myVote.nickname;
      if (!$("msg").value) $("msg").value = myVote.message;
    }
  }

  /* ---------- 시작 ---------- */
  loadResults().then(function () {
    if (!myVote) setNote("", false);
    refreshSubmit();
  });
  // 다른 사람 표가 들어오면 화면에 반영 (30초마다)
  setInterval(loadResults, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) loadResults();
  });
})();
</script>
</body>
</html>
